appId: com.khmer.launcher
productName: KHMER LAUNCHER
directories:
  output: dist
files:
  - "main.js"
  - "preload.js"
  - "src/**/*"
  - "bundled_mods/**/*"
  - "!**/*.exe"
  - "!dist/**"
  - "!SimplePvPMod/**"
  - "!SimplePvP-Mod/**"
  - "!PvPLauncher/**"
  - "!app/**"
win:
  target:
    - nsis
    - portable
  icon: src/assets/khmer_launcher_logo.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: KHMER LAUNCHER
portable:
  artifactName: KHMERLUNCHER.exe
